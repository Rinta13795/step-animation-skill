<!doctype html>
<html lang="zh">
<head>

<title>二分查找：每一步在比什么</title>
<style>
/* step-animation engine — 样式。build.mjs 会把它整段内联进生成的网页。 */
:root{--bg:#faf9f5;--card:#fff;--tx:#1f1e1d;--mu:#6b6a65;--bd:#e3e1d8;--co:#D85A30;--bl:#378ADD;--pos:#E1F5EE;--post:#0F6E56;--neg:#FCEBEB;--negt:#A32D2D;--hl:#FAEEDA;--hlt:#854F0B;--codebg:#f1efe8;--empty:#f4f3ee;--curline:#fde9dc}
@media (prefers-color-scheme:dark){:root{--bg:#1c1c1b;--card:#262624;--tx:#ecebe6;--mu:#a3a29c;--bd:#3a3936;--pos:#085041;--post:#9FE1CB;--neg:#791F1F;--negt:#F7C1C1;--hl:#633806;--hlt:#FAC775;--codebg:#2f2e2b;--empty:#2f2e2b;--curline:#4a3326}}
*{box-sizing:border-box}
html{scrollbar-gutter:stable}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:20px;font-weight:600;margin:0 0 12px}
#tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
button{font:inherit;font-size:14px;padding:6px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx);cursor:pointer}
button:hover{border-color:var(--mu)}
button.on{background:var(--bl);border-color:var(--bl);color:#fff}
#stage{position:relative;background:var(--card);border:1px solid var(--bd);border-radius:14px;min-height:430px;padding:28px 24px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.row,.flow{display:flex;flex-wrap:wrap;align-items:flex-end;gap:28px}
.col{display:flex;flex-direction:column;gap:18px;align-items:flex-start}
.arrow{font-size:26px;color:var(--mu);align-self:center}
.gw{display:flex;flex-direction:column;gap:6px}
.lab{font-size:13px;color:var(--mu)}
.grid{display:grid;gap:3px}
.idx{font:11px Consolas,monospace;color:var(--mu);text-align:center}
.cell{display:flex;align-items:center;justify-content:center;border-radius:5px;font-family:Consolas,"Courier New",monospace;font-weight:600;background:var(--codebg);transition:background .45s,color .45s,transform .25s,opacity .45s}
.cell.empty{background:var(--empty);outline:1px dashed var(--bd);outline-offset:-1px}
.cell.pos{background:var(--pos);color:var(--post)}
.cell.neg{background:var(--neg);color:var(--negt)}
.cell.hl{background:var(--hl);color:var(--hlt)}
.cell.dim{opacity:.28}
.cell.done{background:var(--empty);color:var(--mu)}
.cell.pop{transform:scale(1.18)}
.cell.bright{outline:1px solid #b4b2a9;outline-offset:-1px}
#stage.inst *{transition:none!important}
.frame{position:absolute;border:3px solid;border-radius:8px;pointer-events:none;transition:left .55s cubic-bezier(.4,0,.2,1),top .55s cubic-bezier(.4,0,.2,1),width .55s cubic-bezier(.4,0,.2,1),height .55s cubic-bezier(.4,0,.2,1),opacity .3s;z-index:3}
.mk{position:absolute;transform:translateX(-50%);padding:1px 7px;border-radius:6px;color:#fff;font:700 13px Consolas,monospace;white-space:nowrap;pointer-events:none;transition:left .55s cubic-bezier(.4,0,.2,1),top .55s cubic-bezier(.4,0,.2,1),opacity .3s;z-index:4}
.fly{position:absolute;transform:translate(-50%,-50%);padding:3px 9px;border-radius:7px;background:var(--co);color:#fff;font:700 15px Consolas,monospace;z-index:6;white-space:nowrap}

.vars .vv{font-weight:700}

.tbl tr.hlrow{background:var(--neg)}
.chart svg{display:block;max-width:100%;height:auto;overflow:visible}

.prog i{display:block;height:100%;width:0;background:var(--bl);transition:width .3s}
.hint{font-size:13px;color:var(--mu);margin-top:8px}
#checkPanel{margin-bottom:12px;padding:10px 14px;border-radius:8px;font-size:14px;line-height:1.6;border:1px solid var(--bd);background:var(--card)}
#checkPanel.ok{border-color:#1D9E75}
#checkPanel.bad{border-color:#E24B4A}
#checkPanel li{font-family:Consolas,monospace;font-size:13px}

<script>
/* =====================================================================
 * step-animation engine v1

 *   const LESSON = {title:'…'};

/* ---------- 数字格子 ---------- */
/* 状态 st：''  'img'(按亮度上色)  'imgh'(上色但不显示数字)  'pos'(绿)  'neg'(红)  'hl'(黄)  'dim'(变淡)  'done'(灰掉)  'empty'(虚线空格) */

/* ---------- 结果框 ---------- */
function valBox(label, o) {

  return { w, el: v, set(t) { v.textContent = t; v.style.outline = 'none'; pop(v); changed(); }, clear() { v.textContent = ''; v.style.outline = ''; changed(); } };
}

/* ---------- 变量面板：vars(['lo','hi','mid'], '变量') ---------- */
function vars(names, label) {
  const w = el('div', 'gw'); if (label) w.appendChild(el('div', 'lab', label));

    w,
    set(n, v) { const r = rows[n]; r.querySelector('.vv').textContent = v; if (!INST) { r.classList.add('flash'); setTimeout(() => r.classList.remove('flash'), 700); } changed(); },
    el(n) { return rows[n].querySelector('.vv'); },
    row(n) { return rows[n]; },
  };
}

/* ---------- 表格：table([[表头...],[...],...], {label}) ---------- */
function table(rows, o) {
  o = o || {}; const w = el('div', 'gw'); if (o.label) w.appendChild(el('div', 'lab', o.label));

/* ---------- 框：橙框 = 正在读，蓝框 = 正在写；同名的框会平滑移动 ---------- */
/* 量位置时忽略「弹一下」的放大效果，不然框会跟着变大 */

function frame(name, color, cells, pad) {

  pad = pad == null ? 5 : pad; let f = frames[name]; const fresh = !f;

/* 动画模式下改了内容就马上重新对准；瞬间重放时由 go() 在最后统一对准一次 */
function changed() { if (!INST) relayout(); }

/* ---------- 指针标签：mark('lo', 格子, 'lo', BL)；同一格子上的多个标签会自动上下错开 ---------- */
function mark(name, cell, text, color, side) {

function noMark(...names) { (names.length ? names : Object.keys(marks)).forEach(n => { const m = marks[n]; if (m) { m.on = false; m.e.style.opacity = 0; } }); layoutMarks(); }

/* ---------- 飞行数字：从一个格子飞到另一个格子，到了再执行 then ---------- */
function fly(from, to, text, then, color, delay) {

    const sr = stage.getBoundingClientRect(), a = from.getBoundingClientRect(), b = to.getBoundingClientRect();

/* ---------- SVG 折线图 ---------- */

function sv(tag, attrs, parent) { const e = document.createElementNS(NS, tag); for (const a in attrs) e.setAttribute(a, attrs[a]); if (parent) parent.appendChild(e); return e; }
/* chart({w,h, xmin,xmax,xt:[横轴刻度], ymin,ymax,yt:[纵轴刻度], xl:'横轴名', yl:'纵轴名', label:'图标题', fmt:v=>刻度文字}) */

  const w = el('div', 'gw chart'); if (o.label) w.appendChild(el('div', 'lab', o.label)); w.appendChild(svg);

  const C = {
    w, svg, x, y, W, H, L, R, TP, BT,
    /* 折线：xs、ys 两个等长数组；不在 INST 时线条会逐渐画出来 */

  },
  steps: [
    { c: 'a = [3, 8, 12, 17, 23, 31, 42, 56, 64, 77, 85, 93]',
      p: 'Python 的列表就像 Java 的 <code>int[]</code>：一排格子，上面的小字是<b>下标</b>，从 0 开始数。二分查找有个前提：数组必须<b>已经排好序</b>。',
      run(S) { frame('a', CO, S.g.all()); } },
    { c: 'a[5]   →   31',
      p: '用下标取值：<code>a[5]</code> 就是第 5 格（从 0 数），值是 <b>31</b>。和 Java 的 <code>a[5]</code> 一模一样。',
      run(S) { frame('a', CO, [S.g.c(5)]); fly(S.g.c(5), S.r.el, '31', () => S.r.set('31')); } },
    { c: 'len(a)   →   12',
      p: '<code>len(a)</code> 是格子个数，相当于 Java 的 <code>a.length</code>。最后一格的下标是 <b>len(a) − 1 = 11</b>。',
      run(S) { frame('a', CO, S.g.all()); fly(S.g.c(11), S.r.el, '12 个', () => S.r.set('12')); } },
  ],
});

/* 1、2 两节结构一样，只是要找的数不同：用一个函数按 trace 生成 */
function searchScene(name, target, intro) {
  const ev = trace(A, target), steps = [];
  const rel = m => A[m] === target ? '==' : A[m] < target ? '<' : '>';
  ev.forEach(e => {
    if (e.t === 'init') steps.push({
      c: [1, 2],
      p: `${intro}先放两个指针：<b>lo = 0</b> 指向第一格，<b>hi = len(a) − 1 = ${N - 1}</b> 指向最后一格。要找的数如果存在，一定在 lo 到 hi 之间（橙框）。`,
      run(S) { S.v.set('lo', 0); S.v.set('hi', N - 1); mark('lo', S.g.c(0), 'lo', BL); mark('hi', S.g.c(N - 1), 'hi', BL); frame('a', CO, S.g.cols(0, N - 1)); },
    });
    if (e.t === 'mid') steps.push({
      c: [3, 4],
      p: `lo = ${e.lo} ≤ hi = ${e.hi}，范围里还有格子，继续。取正中间：mid = (${e.lo} + ${e.hi}) // 2 = <b>${e.mid}</b>。<code>//</code> 是整除，和 Java 里两个 int 相除一样，小数直接丢掉。`,
      run(S) {
        frame('a', CO, S.g.cols(e.lo, e.hi));
        fly(S.v.el('lo'), S.v.el('mid'), `(${e.lo}+${e.hi})//2`, () => { S.v.set('mid', e.mid); mark('mid', S.g.c(e.mid), 'mid', CO); });
      },
    });
    if (e.t === 'found' || e.t === 'less' || e.t === 'greater') {
      const r = rel(e.mid);
      steps.push({
        c: r === '==' ? [5] : r === '<' ? [5, 7] : [5, 7, 9],
        p: `看中间那格：a[${e.mid}] = <b>${A[e.mid]}</b>，和要找的 ${target} 比，${A[e.mid]} ${r} ${target}。` +
          (r === '==' ? '<b>相等，找到了！</b>' : r === '<' ? '中间的数<b>太小</b>，走 elif 分支。' : '中间的数<b>太大</b>，走 else 分支。'),
        run(S) {
          frame('a', CO, [S.g.c(e.mid)]); frame('b', BL, [S.cmp.el]);
          fly(S.g.c(e.mid), S.cmp.el, A[e.mid], () => { S.v.set('a[mid]', A[e.mid]); S.cmp.set(`${A[e.mid]} ${r} ${target}`); });
        },
      });
    }
    if (e.t === 'found') steps.push({
      c: [6],
      p: `返回下标 <b>${e.mid}</b>。一共只看了 ${ev.filter(x => x.t === 'mid').length} 个格子；如果从头一个个找（顺序查找），要看 ${e.mid + 1} 个。`,
      run(S) { noFrame('b'); frame('a', GN, [S.g.c(e.mid)]); S.g.set(0, e.mid, A[e.mid], 'pos'); fly(S.v.el('mid'), S.res.el, e.mid, () => S.res.set(e.mid)); },
    });
    if (e.t === 'less') steps.push({
      c: [8],
      p: `数组是排好序的，a[${e.mid}] 已经比 ${target} 小，那 mid 和它<b>左边的格子全都更小</b>，整段丢掉（变淡）：lo = mid + 1 = <b>${e.lo}</b>。一下排除了 ${e.mid - e.oldLo + 1} 个格子。`,
      run(S) {
        for (let c = e.oldLo; c <= e.mid; c++) T(() => S.g.set(0, c, A[c], 'dim'), (c - e.oldLo) * 60);
        noMark('mid'); noFrame('b'); frame('a', CO, S.g.cols(e.lo, e.hi));
        fly(S.v.el('mid'), S.v.el('lo'), 'mid + 1', () => { S.v.set('lo', e.lo); mark('lo', S.g.c(Math.min(e.lo, N - 1)), 'lo', BL); });
      },
    });
    if (e.t === 'greater') steps.push({
      c: [10],
      p: `a[${e.mid}] 比 ${target} 大，那 mid 和它<b>右边的格子全都更大</b>，整段丢掉：hi = mid − 1 = <b>${e.hi}</b>。一下排除了 ${e.oldHi - e.mid + 1} 个格子。`,
      run(S) {
        for (let c = e.mid; c <= e.oldHi; c++) T(() => S.g.set(0, c, A[c], 'dim'), (e.oldHi - c) * 60);
        noMark('mid'); noFrame('b'); frame('a', CO, S.g.cols(e.lo, e.hi));
        fly(S.v.el('mid'), S.v.el('hi'), 'mid − 1', () => { S.v.set('hi', e.hi); mark('hi', S.g.c(Math.max(e.hi, 0)), 'hi', BL); });
      },
    });
    if (e.t === 'none') steps.push({
      c: [3, 11],
      p: `现在 lo = ${e.lo} > hi = ${e.hi}：lo 跑到了 hi 的右边，中间<b>一个格子都不剩</b>，while 条件不成立，退出循环。说明 ${target} 不在数组里，返回 <b>-1</b>（Java 的 <code>indexOf</code> 找不到也返回 -1）。`,
      run(S) { noFrame(); fly(S.v.el('lo'), S.res.el, '-1', () => S.res.set('-1')); },
    });
  });
  return {
    n: name, code: CODE,
    build() {
      const g = grid(A, { s: 54, label: `a，要找 target = ${target}`, idx: 1, below: 3 });
      const v = vars(['target', 'lo', 'hi', 'mid', 'a[mid]'], '变量');
      const cmp = valBox('比较', { w: 150 }), res = valBox('返回值');
      v.set('target', target);
      stage.appendChild(col(g, row(v, cmp, res)));
      return { g, v, cmp, res };
    },
    steps,
  };
}
SC.push(searchScene('① 找 77（找得到）', 77, '在 a 里找 77。'));
SC.push(searchScene('② 找 50（找不到）', 50, '这次找一个<b>不在</b>数组里的数：50。'));

/* 3 为什么快：真的跑两种查找，数比较了几次 */
function linearCount(n) { let c = 0; for (let i = 0; i < n; i++) c++; return c; }           // 最坏情况：要找的数不在里面
function binaryCount(n) { let lo = 0, hi = n - 1, c = 0; while (lo <= hi) { c++; lo = ((lo + hi) >> 1) + 1; } return c; } // 最坏：target 比所有数都大
const NS_ = Array.from({ length: 1000 }, (_, i) => i + 1);
const LIN = NS_.map(linearCount), BIN = NS_.map(binaryCount);
SC.push({
  n: '③ 为什么快（图）',
  build() {
    const C = chart({ w: 860, h: 220, xmin: 0, xmax: 1000, xt: [0, 200, 400, 600, 800, 1000], ymin: 0, ymax: 1000, yt: [0, 250, 500, 750, 1000], xl: '数组长度 n', yl: '最坏要比几次', label: '比较次数（把两种查找真的跑一遍数出来的）' });
    const Z = chart({ w: 860, h: 190, xmin: 0, xmax: 1000, xt: [0, 200, 400, 600, 800, 1000], ymin: 0, ymax: 12, yt: [0, 4, 8, 12], xl: '数组长度 n', yl: '二分查找比几次', label: '把二分查找那条线放大看' });
    stage.appendChild(col(C, Z));
    return { C, Z };
  },
  steps: [
    { c: 'for x in a:            # 顺序查找：从头一个个比\n    if x == target: ...',
      p: '顺序查找：最坏情况要把<b>每个格子都看一遍</b>。n 个数就比 n 次，所以是一条斜着往上的直线：1000 个数要比 1000 次。',
      wait: 2500,
      run(S) { S.C.line(NS_, LIN, GR, 2.5, 2500); T(() => S.C.text(1000, 1000, '顺序查找：1000 次', GR, 'end'), 2500); } },
    { c: 'binary_search(a, target)',
      p: '二分查找每比一次就<b>丢掉一半</b>，1000 个数最多比 <b>10 次</b>。在同一张图里，它几乎贴着横轴，看不出在涨。',
      wait: 2500,
      run(S) { S.C.line(NS_, BIN, BL, 2.5, 2500); T(() => { S.C.dot(1000, 10, BL, 5); S.C.text(990, 60, '二分查找：10 次', BL, 'end'); }, 2500); } },
    { c: '# 放大看二分查找',
      p: '放大以后是一级一级的<b>台阶</b>：n 每翻一倍（红虚线：2、4、8 … 512），才多比 1 次。这就是常说的 <b>O(log n)</b>：log₂1000 ≈ 10。',
      wait: 2500,
      run(S) {
        S.Z.line(NS_, BIN, BL, 2, 2500);
        [2, 4, 8, 16, 32, 64, 128, 256, 512].forEach((p, i) => T(() => S.Z.vline(p, RD), 2500 + i * 80));
        T(() => S.Z.text(512, 11.4, 'n = 512 → 10 次', RD, 'start'), 3300);
      } },
  ],
});

;if (typeof LESSON !== 'undefined') window.LESSON = LESSON;
})();
</script>
